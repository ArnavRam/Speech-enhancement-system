name: MATLAB tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          products: Signal_Processing_Toolbox

      - uses: matlab-actions/run-tests@v2
        with:
          select-by-folder: tests
